<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录注册</title>
    <style>
        /* 添加禁止滚动样式*/
        html,
        body {
            overflow: hidden;
            height: 100%;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f2f5;
        }

       .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 400px;
            margin: 20px 0;
            transform: translateY(-10px);
        }

       .tabs {
            display: flex;
            margin-bottom: 2rem;
        }

       .tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border-bottom: 3px solid transparent;
        }

       .tab.active {
            border-color: #2196F3;
            font-weight: bold;
            color: #2196F3;
        }

       .form-container {
            position: relative;
        }

       .form {
            display: none;
            opacity: 0;
            transition: 0.3s;
        }

       .form.active {
            display: block;
            opacity: 1;
        }

       .input-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2196F3;
            box-shadow: 0 0 5px rgba(33, 150, 243, 0.3);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: #1976D2;
        }

        /* 添加提示信息的样式 */
       .message {
            margin-top: 1rem;
            padding: 0.5rem;
            border-radius: 5px;
            text-align: center;
        }

       .success {
            background-color: #d4edda;
            color: #155724;
        }

       .error {
            background-color: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 480px) {
           .container {
                width: 90%;
                margin: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="tabs">
            <div class="tab active" onclick="switchForm('login')">登录</div>
            <div class="tab" onclick="switchForm('register')">注册</div>
        </div>

        <div class="form-container">
            <!-- 登录表单 -->
            <form id="loginForm" class="form active" onsubmit="return handleLogin(event)">
                <div id="loginMessage" class="message"></div>
                <div class="input-group">
                    <label>用户名</label>
                    <input type="text" id="loginAccount" required placeholder="请输入用户名">
                </div>
                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" required placeholder="请输入密码">
                </div>
                <button type="submit">立即登录</button>
            </form>

            <!-- 注册表单 -->
            <form id="registerForm" class="form" onsubmit="return handleRegister(event)">
                <div id="registerMessage" class="message"></div>
                <div class="input-group">
                    <label>用户名</label>
                    <input type="text" id="regUsername" required pattern="[A-Za-z0-9]{4,20}" placeholder="请输入4到20位用户名">
                </div>
                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="regPassword" required minlength="6" placeholder="请输入至少6位的密码">
                </div>
                <div class="input-group">
                    <label>确认密码</label>
                    <input type="password" id="regConfirmPassword" required placeholder="请再次输入密码">
                </div>
                <button type="submit">立即注册</button>
            </form>
        </div>
    </div>

    <script>
        // 初始用户数组
        let users = [
            {
                username: "廖聪颖",
                password: "lcy"
            },
            {
                username: "zwcx",
                password: "zwcx"
            }
        ];

        // 从本地存储中读取用户数据，如果没有则初始化为空数组
        const localUsers = JSON.parse(localStorage.getItem('users')) || [];

        function switchForm(formType) {
            // 切换选项卡样式
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelector(`.tab[onclick="switchForm('${formType}')"]`).classList.add('active');

            // 切换表单显示
            document.querySelectorAll('.form').forEach(form => {
                form.classList.remove('active');
            });
            document.getElementById(`${formType}Form`).classList.add('active');

            // 隐藏提示信息
            document.getElementById('loginMessage').innerHTML = "";
            document.getElementById('registerMessage').innerHTML = "";
        }

        function handleLogin(e) {
            e.preventDefault();
            const account = document.getElementById('loginAccount').value;
            const password = document.getElementById('loginPassword').value;

            // 先检查初始用户数组
            let user = users.find(u => u.username === account && u.password === password);
            // 再检查本地存储中的用户数组
            if (!user) {
                user = localUsers.find(u => u.username === account && u.password === password);
            }

            const messageElement = document.getElementById('loginMessage');
            if (user) {
                messageElement.className = "message success";
                messageElement.innerHTML = "登录成功，正在跳转...";
                setTimeout(() => {
                    window.location.href = "https://yyxc.netlify.app/yxc.html";！
                }, 1500);
            } else {
                messageElement.className = "message error";
                messageElement.innerHTML = "用户名/密码错误！";
            }

            return false;
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            const messageElement = document.getElementById('registerMessage');
            // 密码一致性验证
            if (password!== confirmPassword) {
                messageElement.className = "message error";
                messageElement.innerHTML = "两次输入的密码不一致！";
                return false;
            }

            // 检查初始用户数组中用户是否已存在
            if (users.some(u => u.username === username)) {
                messageElement.className = "message error";
                messageElement.innerHTML = "用户名已被注册！";
                return false;
            }

            // 检查本地存储用户数组中用户是否已存在
            if (localUsers.some(u => u.username === username)) {
                messageElement.className = "message error";
                messageElement.innerHTML = "用户名已被注册！";
                return false;
            }

            // 保存新用户到初始用户数组
            const newUser = {
                username: username,
                password: password
            };
            users.push(newUser);

            // 将新用户添加到本地存储的用户数组中，并更新本地存储
            localUsers.push(newUser);
            localStorage.setItem('users', JSON.stringify(localUsers));

            messageElement.className = "message success";
            messageElement.innerHTML = "注册成功！";
            setTimeout(() => {
                switchForm('login');
            }, 1500);

            return false;
        }
    </script>
</body>

</html>
