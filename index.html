<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录注册</title>
      <link rel="stylesheet" href="denglu.css">
        <style>
    /*网络监测弹窗 自定义弹窗样式 */
   .custom-alert {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: yellow;
      color: red;
      padding: 20px;
      border: 1px solid #ccc;
      z-index: 1000;
      border-radius: 5%;
    }

    
  </style>
    <style>
     
    </style>
</head>

<body>
    <div class="container">
        <div class="tabs">
            <div class="tab active" onclick="switchForm('login')">登录</div>
            <div class="tab" onclick="switchForm('register')">注册</div>
        </div>

        <div class="form-container">
            <!-- 登录表单 -->
            <form id="loginForm" class="form active" onsubmit="return handleLogin(event)">
                <div id="loginMessage" class="message"></div>
                <div class="input-group">
                    <label>用户名</label>
                    <input type="text" id="loginAccount" required placeholder="请输入用户名">
                </div>
                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="loginPassword" required placeholder="请输入密码">
                </div>
                <button type="submit">立即登录</button>
            </form>

            <!-- 注册表单 -->
            <form id="registerForm" class="form" onsubmit="return handleRegister(event)">
                <div id="registerMessage" class="message"></div>
                <div class="input-group">
                    <label>用户名</label>
                    <input type="text" id="regUsername" required pattern="[A-Za-z0-9]{4,20}" placeholder="请输入4到20位用户名">
                </div>
                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="regPassword" required minlength="6" placeholder="请输入至少6位的密码">
                </div>
                <div class="input-group">
                    <label>确认密码</label>
                    <input type="password" id="regConfirmPassword" required placeholder="请再次输入密码">
                </div>
                <button type="submit">立即注册</button>
            </form>
        </div>
    </div>
<script>
  function showCustomAlert(message) {
    const alertDiv = document.createElement('div');
    alertDiv.className = 'custom-alert';
    alertDiv.textContent = message;
    document.body.appendChild(alertDiv);
    setTimeout(() => {
      document.body.removeChild(alertDiv);
    }, 3000); // 3秒后自动关闭弹窗
  }

  // 页面加载时先检查网络状态
  if (navigator.onLine === false) {
    showCustomAlert('网络已断开，请检查您的网络连接（可能没有 Wi-Fi 或移动数据等网络连接）');
  }

  // 监听网络断开事件
  window.addEventListener('offline', function () {
    showCustomAlert('网络已断开，请检查您的网络连接（可能没有 Wi-Fi 或移动数据等网络连接）');
  });

  // 监听网络连接事件
  window.addEventListener('online', function () {
    showCustomAlert('网络已连接成功！');
    location.reload(); // 添加这行代码，在网络连接成功时刷新页面
  });
</script>
    <script>
      
    </script>
</body>
<script src="https://yyxc.netlify.app/denglu.js"></script>
</html>
